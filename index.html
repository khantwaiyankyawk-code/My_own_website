<!-- Firebase Cloud Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      deleteDoc, 
      doc, 
      onSnapshot, 
      query, 
      orderBy,
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCyR7uTtlrpTMsDUS_59uVu3UbyvMybfTY",
      authDomain: "my-own-website-bb4e9.firebaseapp.com",
      projectId: "my-own-website-bb4e9",
      storageBucket: "my-own-website-bb4e9.firebasestorage.app",
      messagingSenderId: "35886139510",
      appId: "1:35886139510:web:9a1c78e894f7f6e98a3757"
    };

    const PRISMA_SCHEMA_CODE = `// prisma/schema.prisma

datasource db {
  provider = "postgresql"
  url      = env("DATABASE_URL")
}

generator client {
  provider = "prisma-client-js"
}

enum ListingType {
  SOFTWARE
  HARDWARE
}

enum SellerTier {
  FREE
  PRO
}

model User {
  id             String     @id @default(cuid())
  email          String     @unique
  name           String
  avatarUrl      String?
  tier           SellerTier @default(FREE)
  isVerified     Boolean    @default(false)
  telegramHandle String
  phoneNumber    String
  listings       Listing[]
}

model Listing {
  id             String             @id @default(cuid())
  title          String
  description    String
  priceMMK       Int
  type           ListingType
  category       String
  subCategory    String?
  previewUrl     String
  isFeatured     Boolean            @default(false)
  plan           String             @default("FREEMIUM")
  sellerId       String
  seller         User               @relation(fields: [sellerId], references: [id], onDelete: Cascade)
  createdAt      DateTime           @default(now())
};`;

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const listingsCol = collection(db, "listings");

    const CATEGORIES_DATA = {
      SOFTWARE: [
        'All Software',
        'Curated Study Packs',
        'Digital Templates & Tools',
        'Code Snippets & Starter Projects'
      ],
      HARDWARE: [
        'All Hardware',
        'Laptops & Ultrabooks',
        'Smartphones & Tablets',
        'Chargers, Cables & Power Adapters',
        'Peripherals & Accessories',
        'Maker & IoT Hardware'
      ]
    };

    const INITIAL_USERS = [];

    const savedUsers = localStorage.getItem('techswap_users');
    const savedCurrentUserId = localStorage.getItem('techswap_current_user_id');

    window.AppState = {
      theme: localStorage.getItem('techswap_theme') || 'dark',
      users: savedUsers ? JSON.parse(savedUsers) : INITIAL_USERS,
      listings: [],
      currentUser: null,
      activeDivision: 'ALL',
      selectedCategory: 'ALL',
      searchQuery: '',
      priceSort: 'DEFAULT',
      onlyFeatured: false,
      activeProduct: null,
      currentPostType: 'SOFTWARE',
      regTier: 'FREE',
      selectedPlan: 'FREEMIUM',
      isUserDropdownOpen: false
    };

    // စစဝင်ချင်း မည်သည့် Account မှ Default မဝင်ထားစေရန် သတ်မှတ်ခြင်း
    if (savedCurrentUserId) {
      window.AppState.currentUser = window.AppState.users.find(u => u.id === savedCurrentUserId) || null;
    } else {
      window.AppState.currentUser = null;
    }

    const q = query(listingsCol, orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      window.AppState.listings = snapshot.docs.map(docSnap => ({
        id: docSnap.id,
        ...docSnap.data()
      }));
      window.renderListings();
      window.renderCategoryPills();
    }, (error) => {
      console.error("Firebase Realtime Error:", error);
    });

    function saveUserState() {
      localStorage.setItem('techswap_users', JSON.stringify(window.AppState.users));
      if (window.AppState.currentUser) {
        localStorage.setItem('techswap_current_user_id', window.AppState.currentUser.id);
      } else {
        localStorage.removeItem('techswap_current_user_id');
      }
    }

    window.applyTheme = function() {
      const html = document.documentElement;
      const themeIcon = document.getElementById('theme-icon');
      if (window.AppState.theme === 'dark') {
        html.classList.add('dark');
        if (themeIcon) themeIcon.setAttribute('data-lucide', 'sun');
      } else {
        html.classList.remove('dark');
        if (themeIcon) themeIcon.setAttribute('data-lucide', 'moon');
      }
      lucide.createIcons();
    };

    window.toggleTheme = function() {
      window.AppState.theme = window.AppState.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('techswap_theme', window.AppState.theme);
      window.applyTheme();
    };

    window.showToast = function(message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'pointer-events-auto flex items-center gap-3 bg-brand-600 text-white px-5 py-3 rounded-xl shadow-2xl border border-brand-400/40 transition-all duration-300';
      toast.innerHTML = `
        <i data-lucide="check-circle-2" class="w-5 h-5 flex-shrink-0"></i>
        <span class="text-sm font-medium">${message}</span>
      `;
      container.appendChild(toast);
      lucide.createIcons();

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-10px)';
        setTimeout(() => toast.remove(), 3500);
      }, 3500);
    };

    window.renderUserNav = function() {
      const slot = document.getElementById('user-profile-button-slot');
      const activeUserBadge = document.getElementById('active-user-badge');
      const userSwitchList = document.getElementById('user-switch-list');

      if (!window.AppState.currentUser) {
        slot.innerHTML = `
          <button onclick="openAuthModal('SIGN_IN')" class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-xl border bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-brand-600 dark:text-brand-400 border-slate-200 dark:border-slate-700 shadow-sm transition">
            <i data-lucide="log-in" class="w-3.5 h-3.5"></i>
            <span>Sign In</span>
          </button>
        `;
        document.getElementById('user-dropdown-menu').classList.add('hidden');
        lucide.createIcons();
        return;
      }

      const firstName = window.AppState.currentUser.name.split(' ')[0];
      const isPro = window.AppState.currentUser.tier === 'PRO';

      slot.innerHTML = `
        <button onclick="toggleUserDropdown(event)" class="flex items-center gap-2 border px-2.5 py-1.5 rounded-xl text-xs transition bg-white dark:bg-slate-800/60 hover:bg-slate-50 dark:hover:bg-slate-800 border-slate-200 dark:border-slate-700/80 shadow-sm">
          <img src="${window.AppState.currentUser.avatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80'}" alt="${window.AppState.currentUser.name}" class="w-5 h-5 rounded-full object-cover ring-1 ring-brand-500">
          <div class="text-left hidden sm:block">
            <div class="flex items-center gap-1 font-semibold text-slate-800 dark:text-slate-200">
              ${firstName}
              ${isPro ? '<i data-lucide="shield-check" class="w-3.5 h-3.5 text-brand-500"></i>' : ''}
            </div>
            <div class="text-[10px] text-slate-500 dark:text-slate-400">
              ${isPro ? 'Verified Pro' : 'Community Member'}
            </div>
          </div>
        </button>
      `;

      activeUserBadge.innerHTML = `
        <div class="font-semibold text-xs text-brand-500">${window.AppState.currentUser.name}</div>
        <div class="text-[11px] text-slate-600 dark:text-slate-300">${window.AppState.currentUser.email}</div>
        <div class="text-[10px] text-slate-400 mt-0.5">Telegram: @${window.AppState.currentUser.telegramHandle || 'member'}</div>
      `;

      userSwitchList.innerHTML = window.AppState.users.map(usr => `
        <button onclick="switchCurrentUser('${usr.id}')" class="w-full flex items-center justify-between p-2 rounded-xl text-left text-xs transition ${
          window.AppState.currentUser.id === usr.id 
            ? 'bg-brand-50 dark:bg-brand-500/15 text-brand-700 dark:text-brand-400 border border-brand-200 dark:border-brand-500/30 font-semibold'
            : 'hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300'
        }">
          <div class="flex items-center gap-2">
            <img src="${usr.avatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80'}" alt="${usr.name}" class="w-5 h-5 rounded-full object-cover">
            <span class="truncate max-w-[120px]">${usr.name}</span>
          </div>
          <span class="text-[9px] px-1.5 py-0.5 rounded font-mono ${
            usr.tier === 'PRO' ? 'bg-indigo-500/20 text-indigo-400' : 'bg-slate-500/20 text-slate-400'
          }">${usr.tier}</span>
        </button>
      `).join('');

      lucide.createIcons();
    };

    window.toggleUserDropdown = function(e) {
      e.stopPropagation();
      document.getElementById('user-dropdown-menu').classList.toggle('hidden');
    };

    document.addEventListener('click', (e) => {
      const wrapper = document.getElementById('user-menu-wrapper');
      const menu = document.getElementById('user-dropdown-menu');
      if (wrapper && !wrapper.contains(e.target) && menu) {
        menu.classList.add('hidden');
      }
    });

    window.switchCurrentUser = function(id) {
      const found = window.AppState.users.find(u => u.id === id);
      if (found) {
        window.AppState.currentUser = found;
        saveUserState();
        document.getElementById('user-dropdown-menu').classList.add('hidden');
        window.renderUserNav();
        window.renderListings();
        window.showToast(`Switched active profile to ${found.name}`);
      }
    };

    window.signOutUser = function() {
      window.AppState.currentUser = null;
      saveUserState();
      document.getElementById('user-dropdown-menu').classList.add('hidden');
      window.renderUserNav();
      window.renderListings();
      window.showToast('Signed out of Tech Swap');
    };

    window.setDivision = function(division) {
      window.AppState.activeDivision = division;
      window.AppState.selectedCategory = 'ALL';

      const btnAll = document.getElementById('nav-btn-all');
      const btnSoft = document.getElementById('nav-btn-software');
      const btnHard = document.getElementById('nav-btn-hardware');
      const inactiveClasses = 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white';
      
      btnAll.className = 'px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all ' + 
        (division === 'ALL' ? 'bg-white dark:bg-slate-800 text-brand-600 dark:text-brand-400 shadow-sm font-semibold' : inactiveClasses);
      
      btnSoft.className = 'flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all ' + 
        (division === 'SOFTWARE' ? 'bg-brand-500/20 text-brand-400 border border-brand-500/30 font-semibold' : inactiveClasses);

      btnHard.className = 'flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all ' + 
        (division === 'HARDWARE' ? 'bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 font-semibold' : inactiveClasses);

      window.renderCategoryPills();
      window.renderListings();
    };

    window.renderCategoryPills = function() {
      const container = document.getElementById('category-pills-container');
      const { activeDivision, selectedCategory, listings } = window.AppState;

      let pillsHTML = `
        <button onclick="setCategory('ALL')" class="text-xs px-3 py-1.5 rounded-xl border transition ${
          selectedCategory === 'ALL'
            ? 'bg-slate-900 dark:bg-slate-800 text-white border-slate-900 dark:border-slate-600 font-semibold'
            : 'bg-white dark:bg-slate-900/60 text-slate-600 dark:text-slate-400 border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700 shadow-sm'
        }">
          All Categories (${listings.length})
        </button>
      `;

      if (activeDivision === 'ALL' || activeDivision === 'SOFTWARE') {
        CATEGORIES_DATA.SOFTWARE.slice(1).forEach(cat => {
          const isSelected = selectedCategory === cat;
          pillsHTML += `
            <button onclick="setCategory('${cat}')" class="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-xl border transition ${
              isSelected
                ? 'bg-brand-500/20 text-brand-500 border-brand-500/40 font-semibold'
                : 'bg-white dark:bg-slate-900/60 text-slate-600 dark:text-slate-400 border-slate-200 dark:border-slate-800 hover:border-slate-300 shadow-sm'
            }">
              <i data-lucide="code-2" class="w-3 h-3 text-brand-500"></i>
              ${cat}
            </button>
          `;
        });
      }

      if (activeDivision === 'ALL' || activeDivision === 'HARDWARE') {
        CATEGORIES_DATA.HARDWARE.slice(1).forEach(cat => {
          const isSelected = selectedCategory === cat;
          pillsHTML += `
            <button onclick="setCategory('${cat}')" class="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-xl border transition ${
              isSelected
                ? 'bg-indigo-500/20 text-indigo-500 border-indigo-500/40 font-semibold'
                : 'bg-white dark:bg-slate-900/60 text-slate-600 dark:text-slate-400 border-slate-200 dark:border-slate-800 hover:border-slate-300 shadow-sm'
            }">
              <i data-lucide="laptop" class="w-3 h-3 text-indigo-500"></i>
              ${cat}
            </button>
          `;
        });
      }

      container.innerHTML = pillsHTML;
      lucide.createIcons();
    };

    window.setCategory = function(cat) {
      window.AppState.selectedCategory = cat;
      window.renderCategoryPills();
      window.renderListings();
    };

    window.handleSearchChange = function(val) {
      window.AppState.searchQuery = val;
      const clearBtn = document.getElementById('clear-search-btn');
      if (val.trim()) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      window.renderListings();
    };

    window.clearSearch = function() {
      const input = document.getElementById('search-input');
      input.value = '';
      window.AppState.searchQuery = '';
      document.getElementById('clear-search-btn').classList.add('hidden');
      window.renderListings();
    };

    window.handleSortChange = function(val) {
      window.AppState.priceSort = val;
      window.renderListings();
    };

    window.toggleFeaturedOnly = function() {
      window.AppState.onlyFeatured = !window.AppState.onlyFeatured;
      const btn = document.getElementById('featured-toggle-btn');
      if (window.AppState.onlyFeatured) {
        btn.className = 'flex items-center gap-1.5 px-3 py-2.5 rounded-xl text-xs font-semibold border transition bg-amber-500/20 text-amber-500 border-amber-500/40';
      } else {
        btn.className = 'flex items-center gap-1.5 px-3 py-2.5 rounded-xl text-xs font-medium border transition bg-slate-50 dark:bg-slate-950 text-slate-600 dark:text-slate-400 border-slate-200 dark:border-slate-800 hover:text-slate-900 dark:hover:text-slate-200';
      }
      window.renderListings();
    };

    window.resetAllFilters = function() {
      window.AppState.activeDivision = 'ALL';
      window.AppState.selectedCategory = 'ALL';
      window.AppState.searchQuery = '';
      window.AppState.priceSort = 'DEFAULT';
      window.AppState.onlyFeatured = false;

      document.getElementById('search-input').value = '';
      document.getElementById('clear-search-btn').classList.add('hidden');
      document.getElementById('sort-select').value = 'DEFAULT';

      const featBtn = document.getElementById('featured-toggle-btn');
      featBtn.className = 'flex items-center gap-1.5 px-3 py-2.5 rounded-xl text-xs font-medium border transition bg-slate-50 dark:bg-slate-950 text-slate-600 dark:text-slate-400 border-slate-200 dark:border-slate-800 hover:text-slate-900 dark:hover:text-slate-200';

      window.setDivision('ALL');
    };

    window.renderListings = function() {
      const grid = document.getElementById('listings-grid');
      const emptyState = document.getElementById('empty-state');
      const resetBtn = document.getElementById('reset-filters-btn');
      const catalogTitle = document.getElementById('catalog-title');
      const catalogSubtitle = document.getElementById('catalog-subtitle');

      if (window.AppState.activeDivision === 'ALL') {
        catalogTitle.textContent = 'All Marketplace Listings';
      } else if (window.AppState.activeDivision === 'SOFTWARE') {
        catalogTitle.textContent = 'Part 1: Software & Digital Assets';
      } else {
        catalogTitle.textContent = 'Part 2: Hardware & Pre-Owned Gear';
      }

      const isFiltered = window.AppState.activeDivision !== 'ALL' || window.AppState.selectedCategory !== 'ALL' || window.AppState.searchQuery || window.AppState.onlyFeatured;
      if (isFiltered) resetBtn.classList.remove('hidden');
      else resetBtn.classList.add('hidden');

      const filtered = window.AppState.listings.filter(item => {
        if (window.AppState.activeDivision !== 'ALL' && item.type !== window.AppState.activeDivision) return false;
        if (window.AppState.selectedCategory !== 'ALL' && !window.AppState.selectedCategory.startsWith('All')) {
          if (item.category !== window.AppState.selectedCategory) return false;
        }
        if (window.AppState.onlyFeatured && !item.isFeatured) return false;
        if (window.AppState.searchQuery.trim() !== '') {
          const q = window.AppState.searchQuery.toLowerCase();
          const matchTitle = item.title?.toLowerCase().includes(q);
          const matchDesc = item.description?.toLowerCase().includes(q);
          const matchCat = item.category?.toLowerCase().includes(q);
          const matchLoc = item.meetupLocation ? item.meetupLocation.toLowerCase().includes(q) : false;
          if (!matchTitle && !matchDesc && !matchCat && !matchLoc) return false;
        }
        return true;
      });

      filtered.sort((a, b) => {
        if (a.isFeatured !== b.isFeatured) return a.isFeatured ? -1 : 1;
        if (window.AppState.priceSort === 'LOW_TO_HIGH') return a.priceMMK - b.priceMMK;
        if (window.AppState.priceSort === 'HIGH_TO_LOW') return b.priceMMK - a.priceMMK;
        return 0;
      });

      catalogSubtitle.textContent = `Showing ${filtered.length} direct peer items`;

      if (filtered.length === 0) {
        grid.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      grid.innerHTML = filtered.map(item => {
        const isSoftware = item.type === 'SOFTWARE';
        const usdEst = (item.priceMMK / 3500).toFixed(1);

        let badgeExtra = '';
        if (!isSoftware && item.condition) {
          const condText = item.condition === 'LIKE_NEW' ? 'Like New' : item.condition === 'EXCELLENT_90_PLUS' ? '90%+ Clean' : 'Fair';
          const batt = item.batteryHealth ? ` · Batt: ${item.batteryHealth}%` : '';
          badgeExtra = `<span class="text-[10px] px-2 py-0.5 rounded bg-slate-950/90 border border-slate-700/80 text-indigo-300 font-mono">${condText}${batt}</span>`;
        } else if (isSoftware && item.digitalType) {
          badgeExtra = `<span class="text-[10px] px-2 py-0.5 rounded bg-slate-950/90 border border-slate-700/80 text-brand-300 font-mono">${item.digitalType.replace(/_/g, ' ')}</span>`;
        }

        const borderFeaturedClass = item.isFeatured 
          ? 'bg-white dark:bg-slate-900/90 border-amber-400 dark:border-amber-500/40 ring-1 ring-amber-400/30 dark:ring-amber-500/20'
          : 'bg-white dark:bg-slate-900/80 hover:bg-slate-50/50 dark:hover:bg-slate-900 border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700';

        return `
          <div onclick="openProductModal('${item.id}')" class="group relative flex flex-col border rounded-2xl overflow-hidden cursor-pointer transition-all duration-300 hover:-translate-y-1 hover:shadow-xl ${borderFeaturedClass}">
            <div class="relative h-44 w-full bg-slate-950 overflow-hidden">
              <img src="${item.previewUrl}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
              <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-80"></div>
              
              ${item.isFeatured ? `
                <div class="absolute top-2.5 left-2.5 flex items-center gap-1 bg-amber-500 text-slate-950 font-bold text-[10px] uppercase tracking-wider px-2 py-0.5 rounded shadow">
                  <i data-lucide="sparkles" class="w-3 h-3 fill-slate-950"></i>
                  Featured / Premium
                </div>
              ` : ''}

              <div class="absolute top-2.5 right-2.5">
                ${isSoftware ? `
                  <span class="flex items-center gap-1 text-[10px] font-semibold px-2 py-0.5 rounded-full bg-brand-500 text-slate-950 backdrop-blur-md shadow">
                    <i data-lucide="code-2" class="w-3 h-3"></i>
                    Digital
                  </span>
                ` : `
                  <span class="flex items-center gap-1 text-[10px] font-semibold px-2 py-0.5 rounded-full bg-indigo-600 text-white backdrop-blur-md shadow">
                    <i data-lucide="laptop" class="w-3 h-3"></i>
                    Hardware
                  </span>
                `}
              </div>

              <div class="absolute bottom-2 left-2.5 flex items-center gap-1.5 flex-wrap">
                ${badgeExtra}
              </div>
            </div>

            <div class="p-4 flex-1 flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between text-[11px] mb-1.5 text-slate-500 dark:text-slate-400">
                  <span class="truncate max-w-[170px]">${item.category}</span>
                  <span>Direct Cloud</span>
                </div>

                <h3 class="font-semibold text-sm transition-colors line-clamp-2 leading-snug text-slate-900 dark:text-slate-100 group-hover:text-brand-500">
                  ${item.title}
                </h3>

                <div class="mt-2.5 flex items-baseline gap-2">
                  <span class="text-base font-extrabold text-slate-900 dark:text-white">
                    ${Number(item.priceMMK).toLocaleString()} MMK
                  </span>
                  <span class="text-[10px] font-mono text-slate-400 dark:text-slate-500">
                    ≈ $${usdEst}
                  </span>
                </div>
              </div>

              <div class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-800/80 flex items-center justify-between text-xs">
                <div class="flex items-center gap-1.5">
                  <img src="${item.sellerAvatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80'}" alt="seller" class="w-5 h-5 rounded-full object-cover">
                  <span class="font-medium text-[11px] truncate max-w-[100px] text-slate-700 dark:text-slate-300">
                    ${item.sellerName || 'Verified Seller'}
                  </span>
                </div>

                <div class="flex items-center gap-1 text-[11px] truncate max-w-[120px] text-slate-500 dark:text-slate-400">
                  ${isSoftware ? `
                    <span class="text-brand-500 font-medium">Instant</span>
                  ` : `
                    <div class="flex items-center gap-0.5 truncate">
                      <i data-lucide="map-pin" class="w-3 h-3 text-slate-400 flex-shrink-0"></i>
                      <span class="truncate">${item.meetupLocation ? item.meetupLocation.split(',')[0] : 'Yangon'}</span>
                    </div>
                  `}
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    };

    window.openProductModal = function(id) {
      const item = window.AppState.listings.find(x => x.id === id);
      if (!item) return;
      window.AppState.activeProduct = item;

      const isSoftware = item.type === 'SOFTWARE';

      const typeBadge = document.getElementById('modal-type-badge');
      typeBadge.textContent = item.type;
      typeBadge.className = `text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded ${
        isSoftware ? 'bg-brand-500/20 text-brand-500 dark:text-brand-400 border border-brand-500/30' : 'bg-indigo-500/20 text-indigo-500 dark:text-indigo-400 border border-indigo-500/30'
      }`;

      document.getElementById('modal-item-id').textContent = `ID: ${item.id.slice(0, 8)}`;
      document.getElementById('modal-img').src = item.previewUrl;

      const featBadge = document.getElementById('modal-featured-badge');
      if (item.isFeatured) featBadge.classList.remove('hidden');
      else featBadge.classList.add('hidden');

      document.getElementById('modal-category').textContent = `${item.category} · ${item.subCategory || 'General'}`;
      document.getElementById('modal-title').textContent = item.title;
      document.getElementById('modal-price').textContent = `${Number(item.priceMMK).toLocaleString()} MMK`;
      document.getElementById('modal-desc').textContent = item.description;

      const specsDiv = document.getElementById('modal-specs');
      if (isSoftware) {
        specsDiv.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="w-28 text-slate-500 dark:text-slate-400">Digital Format:</span>
            <span class="font-semibold text-brand-500">${item.fileFormat || 'Instant Notion/File'}</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="w-28 text-slate-500 dark:text-slate-400">Delivery:</span>
            <span class="font-mono text-slate-400">${item.digitalType || 'STUDY_PACK'}</span>
          </div>
        `;
      } else {
        const condFormatted = item.condition ? item.condition.replace(/_/g, ' ') : 'Good';
        specsDiv.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="w-28 text-slate-500 dark:text-slate-400">Condition:</span>
            <span class="font-semibold text-indigo-500">${condFormatted}${item.batteryHealth ? ` (Battery: ${item.batteryHealth}%)` : ''}</span>
          </div>
          <div class="flex items-start gap-2">
            <span class="w-28 flex-shrink-0 text-slate-500 dark:text-slate-400">Meetup Location:</span>
            <span class="font-medium text-amber-500 flex items-center gap-1">
              <i data-lucide="map-pin" class="w-3.5 h-3.5 text-amber-500 flex-shrink-0"></i>
              ${item.meetupLocation || 'Kamayut, Yangon'}
            </span>
          </div>
        `;
      }

      document.getElementById('modal-seller-avatar').src = item.sellerAvatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80';
      document.getElementById('modal-seller-name').textContent = item.sellerName || 'Community Seller';

      // ပိုင်ရှင်ဖြစ်မှသာ ဖျက်ခွင့်ပေးမည့် စစ်ဆေးမှု
      const actionSlot = document.getElementById('modal-action-buttons-slot');
      const isOwner = window.AppState.currentUser && (item.sellerEmail?.toLowerCase() === window.AppState.currentUser.email?.toLowerCase());

      if (isOwner) {
        actionSlot.innerHTML = `
          <div class="flex flex-col sm:flex-row items-center gap-2 w-full">
            <div class="text-[11px] text-amber-500 font-medium flex-1 text-center sm:text-left">
              ⭐ သင့်ကိုယ်ပိုင် ပစ္စည်းဖြစ်သည် (ရောင်းထွက်ပြီးပါက ဖျက်နိုင်ပါသည်)
            </div>
            <button onclick="deleteListing('${item.id}')" class="w-full sm:w-auto flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-xl bg-rose-500/15 hover:bg-rose-500/25 border border-rose-500/30 text-rose-500 font-bold text-xs transition">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
              <span>Mark as Sold / Delete Listing</span>
            </button>
          </div>
        `;
      } else {
        const rawTg = (item.contactTelegram || 'techswap').replace('@', '');
        const rawPhone = item.contactPhone || '09976543210';

        actionSlot.innerHTML = `
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
            <a href="https://t.me/${rawTg}" target="_blank" rel="noreferrer" class="flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-sky-500/15 hover:bg-sky-500/25 border border-sky-500/30 text-sky-500 font-semibold text-xs transition">
              <i data-lucide="send" class="w-4 h-4 text-sky-500"></i>
              <span>Telegram (@${rawTg})</span>
            </a>
            <a href="tel:${rawPhone}" class="flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-brand-500/15 hover:bg-brand-500/25 border border-brand-500/30 text-brand-600 dark:text-brand-400 font-semibold text-xs transition">
              <i data-lucide="phone" class="w-4 h-4 text-brand-500"></i>
              <span>Call (${rawPhone})</span>
            </a>
          </div>
        `;
      }

      const modal = document.getElementById('product-detail-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      lucide.createIcons();
    };

    window.closeProductModal = function() {
      const modal = document.getElementById('product-detail-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      window.AppState.activeProduct = null;
    };

    window.deleteListing = async function(id) {
      const confirmDelete = confirm("ပစ္စည်း ရောင်းထွက်သွားပြီ ဖြစ်၍ Cloud စာရင်းထဲမှ အပြီးတိုင် ဖျက်ချင်တာ သေချာပါသလား?");
      if (!confirmDelete) return;

      try {
        await deleteDoc(doc(db, "listings", id));
        window.closeProductModal();
        window.showToast('ပစ္စည်းစာရင်းမှ အောင်မြင်စွာ ဖျက်ပြီးပါပြီ (Sold & Removed)!');
      } catch (err) {
        alert("ဖျက်ရာတွင် အမှားဖြစ်ပေါ်ပါသည်: " + err.message);
      }
    };

    window.copyProductInquiry = function() {
      if (!window.AppState.activeProduct) return;
      const text = `Hi! I found your listing "${window.AppState.activeProduct.title}" (${Number(window.AppState.activeProduct.priceMMK).toLocaleString()} MMK) on Tech Swap. Is it still available?`;
      
      const textArea = document.createElement("textarea");
      textArea.value = text;
      document.body.appendChild(textArea);
      textArea.select();
      try {
        document.execCommand('copy');
        window.showToast('Copied inquiry message to clipboard!');
      } catch (err) {
        window.showToast('Unable to copy text.');
      }
      document.body.removeChild(textArea);
    };

    // 🟢 အကောင့်မဝင်ထားပါက Sign Up ကို အရင်တောင်းဆိုမည့် နေရာ
    window.openCreateListingModal = function() {
      if (!window.AppState.currentUser) {
        window.openAuthModal('SIGN_UP');
        window.showToast("ပစ္စည်းမတင်မီ အမည်နှင့် Email ဖြင့် အကောင့်အရင်ဖွင့်ပေးပါခင်ဗျာ။");
        return;
      }

      document.getElementById('post-seller-name').value = window.AppState.currentUser.name;
      document.getElementById('post-seller-email').value = window.AppState.currentUser.email;
      document.getElementById('post-seller-phone').value = window.AppState.currentUser.phoneNumber || '';
      document.getElementById('post-seller-telegram').value = window.AppState.currentUser.telegramHandle || '';

      populatePostCategorySelect();
      const modal = document.getElementById('create-listing-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      lucide.createIcons();
    };

    window.closeCreateListingModal = function() {
      const modal = document.getElementById('create-listing-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    };

    window.selectListingPlan = function(plan) {
      window.AppState.selectedPlan = plan;
      const cardFree = document.getElementById('plan-card-freemium');
      const cardPrem = document.getElementById('plan-card-premium');
      if (plan === 'FREEMIUM') {
        cardFree.className = 'cursor-pointer p-3.5 rounded-xl border-2 border-brand-500 bg-brand-500/10 transition shadow-sm';
        cardPrem.className = 'cursor-pointer p-3.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 transition';
      } else {
        cardPrem.className = 'cursor-pointer p-3.5 rounded-xl border-2 border-amber-500 bg-amber-500/10 transition shadow-sm';
        cardFree.className = 'cursor-pointer p-3.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 transition';
      }
    };

    window.setPostType = function(type) {
      window.AppState.currentPostType = type;
      const btnSoft = document.getElementById('post-tab-software');
      const btnHard = document.getElementById('post-tab-hardware');
      const softFields = document.getElementById('post-software-fields');
      const hardFields = document.getElementById('post-hardware-fields');

      if (type === 'SOFTWARE') {
        btnSoft.className = 'flex items-center justify-center gap-2 py-3 px-4 rounded-xl border text-xs font-bold transition bg-brand-500/20 border-brand-500 text-brand-600 dark:text-brand-400 shadow-sm';
        btnHard.className = 'flex items-center justify-center gap-2 py-3 px-4 rounded-xl border text-xs font-semibold transition bg-slate-50 dark:bg-slate-950 border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400';
        softFields.classList.remove('hidden');
        hardFields.classList.add('hidden');
      } else {
        btnHard.className = 'flex items-center justify-center gap-2 py-3 px-4 rounded-xl border text-xs font-bold transition bg-indigo-500/20 border-indigo-500 text-indigo-400 shadow-sm';
        btnSoft.className = 'flex items-center justify-center gap-2 py-3 px-4 rounded-xl border text-xs font-semibold transition bg-slate-50 dark:bg-slate-950 border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400';
        hardFields.classList.remove('hidden');
        softFields.classList.add('hidden');
      }

      populatePostCategorySelect();
    };

    function populatePostCategorySelect() {
      const select = document.getElementById('post-category');
      const list = window.AppState.currentPostType === 'SOFTWARE' ? CATEGORIES_DATA.SOFTWARE.slice(1) : CATEGORIES_DATA.HARDWARE.slice(1);
      select.innerHTML = list.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    window.handleFormSubmitListing = async function(e) {
      e.preventDefault();

      const name = document.getElementById('post-seller-name').value.trim();
      const email = document.getElementById('post-seller-email').value.trim();
      const phone = document.getElementById('post-seller-phone').value.trim();
      const tg = document.getElementById('post-seller-telegram').value.replace('@', '').trim();
      const isPremium = window.AppState.selectedPlan === 'PREMIUM';

      let user = window.AppState.currentUser;
      if (user) {
        user.name = name;
        user.phoneNumber = phone;
        user.telegramHandle = tg || user.telegramHandle;
        saveUserState();
      }

      const title = document.getElementById('post-title').value.trim();
      const price = parseInt(document.getElementById('post-price').value, 10) || 0;
      const category = document.getElementById('post-category').value;
      const subCategory = document.getElementById('post-subcategory').value.trim();
      const description = document.getElementById('post-desc').value.trim();
      const previewUrl = document.getElementById('post-preview-url').value.trim() || 
        (window.AppState.currentPostType === 'SOFTWARE' 
          ? 'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=800&q=80' 
          : 'https://images.unsplash.com/photo-1517336714731-489689fd1ca8?auto=format&fit=crop&w=800&q=80');

      const newListing = {
        title,
        description,
        priceMMK: price,
        type: window.AppState.currentPostType,
        category,
        subCategory: subCategory || (window.AppState.currentPostType === 'SOFTWARE' ? 'Digital Asset' : 'Hardware Device'),
        previewUrl,
        isFeatured: isPremium,
        plan: window.AppState.selectedPlan,
        sellerName: name,
        sellerEmail: email,
        sellerAvatar: user?.avatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80',
        contactPhone: phone,
        contactTelegram: tg,
        createdAt: serverTimestamp()
      };

      if (window.AppState.currentPostType === 'HARDWARE') {
        newListing.condition = document.getElementById('post-condition').value;
        const batt = document.getElementById('post-battery').value;
        if (batt) newListing.batteryHealth = parseInt(batt, 10);
        newListing.meetupLocation = document.getElementById('post-location').value;
      } else {
        newListing.digitalType = document.getElementById('post-digital-type').value;
        newListing.fileFormat = document.getElementById('post-file-format').value;
      }

      try {
        await addDoc(listingsCol, newListing);
        window.closeCreateListingModal();
        document.getElementById('create-listing-form').reset();
        window.renderUserNav();
        window.showToast(`Listing posted to Cloud under ${name}!`);
      } catch (err) {
        alert("Cloud သို့ ပစ္စည်းတင်ရာတွင် အမှားဖြစ်ပေါ်ပါသည်: " + err.message);
      }
    };

    window.openAuthModal = function(initialTab = 'SIGN_IN') {
      switchAuthTab(initialTab);
      renderDemoUsersList();
      const modal = document.getElementById('auth-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      lucide.createIcons();
    };

    window.closeAuthModal = function() {
      const modal = document.getElementById('auth-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    };

    function switchAuthTab(tab) {
      const tabSignIn = document.getElementById('auth-tab-signin');
      const tabSignUp = document.getElementById('auth-tab-signup');
      const viewSignIn = document.getElementById('auth-signin-view');
      const viewSignUp = document.getElementById('auth-signup-view');
      const title = document.getElementById('auth-modal-title');

      if (tab === 'SIGN_IN') {
        tabSignIn.className = 'py-2 rounded-xl transition bg-white dark:bg-slate-800 text-brand-600 dark:text-brand-400 shadow-sm';
        tabSignUp.className = 'py-2 rounded-xl transition text-slate-400 hover:text-slate-600';
        viewSignIn.classList.remove('hidden');
        viewSignUp.classList.add('hidden');
        title.textContent = 'Sign In to Tech Swap';
      } else {
        tabSignUp.className = 'py-2 rounded-xl transition bg-white dark:bg-slate-800 text-brand-600 dark:text-brand-400 shadow-sm';
        tabSignIn.className = 'py-2 rounded-xl transition text-slate-400 hover:text-slate-600';
        viewSignUp.classList.remove('hidden');
        viewSignIn.classList.add('hidden');
        title.textContent = 'Create Free Account';
      }
    }

    function renderDemoUsersList() {
      const list = document.getElementById('demo-users-list');
      if (window.AppState.users.length === 0) {
        list.innerHTML = `<div class="text-[11px] text-slate-500 italic p-1">No saved accounts yet. Please sign up above.</div>`;
        return;
      }
      list.innerHTML = window.AppState.users.map(u => `
        <button type="button" onclick="selectDemoUser('${u.id}')" class="w-full flex items-center justify-between p-2 rounded-xl border text-left transition bg-slate-50 dark:bg-slate-950/80 hover:bg-slate-100 dark:hover:bg-slate-800 border-slate-200 dark:border-slate-800">
          <div class="flex items-center gap-2">
            <img src="${u.avatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80'}" alt="${u.name}" class="w-6 h-6 rounded-full object-cover">
            <div>
              <div class="font-semibold text-slate-800 dark:text-slate-200">${u.name}</div>
              <div class="text-[10px] text-slate-400">${u.email}</div>
            </div>
          </div>
          <span class="text-[10px] font-mono text-brand-500 font-semibold">${u.tier}</span>
        </button>
      `).join('');
    }

    window.selectDemoUser = function(id) {
      window.switchCurrentUser(id);
      window.closeAuthModal();
    };

    window.handleEmailSignIn = function(e) {
      e.preventDefault();
      const email = document.getElementById('auth-signin-email').value.trim();
      let matched = window.AppState.users.find(u => u.email.toLowerCase() === email.toLowerCase());
      if (matched) {
        window.AppState.currentUser = matched;
      } else {
        const username = email.split('@')[0];
        matched = {
          id: `usr_${Date.now()}`,
          name: username,
          email,
          avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80',
          tier: 'FREE',
          isVerified: false,
          telegramHandle: username,
          viberNumber: '+959976543210',
          phoneNumber: '09976543210',
          township: 'Yangon',
          bio: 'Tech Swap Member'
        };
        window.AppState.users.push(matched);
        window.AppState.currentUser = matched;
      }
      saveUserState();
      window.closeAuthModal();
      window.renderUserNav();
      window.renderListings();
      window.showToast(`Welcome, ${window.AppState.currentUser.name}!`);
    };

    window.setRegTier = function(tier) {
      window.AppState.regTier = tier;
      const btnFree = document.getElementById('tier-btn-free');
      const btnPro = document.getElementById('tier-btn-pro');
      if (tier === 'FREE') {
        btnFree.className = 'py-2 px-3 rounded-xl border text-center transition bg-brand-500/20 border-brand-500 text-brand-600 dark:text-brand-400 font-bold';
        btnPro.className = 'py-2 px-3 rounded-xl border text-center transition bg-slate-50 dark:bg-slate-950 border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400';
      } else {
        btnPro.className = 'py-2 px-3 rounded-xl border text-center transition bg-indigo-500/20 border-indigo-500 text-indigo-500 font-bold';
        btnFree.className = 'py-2 px-3 rounded-xl border text-center transition bg-slate-50 dark:bg-slate-950 border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400';
      }
    };

    window.handleUserSignUp = function(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const telegram = document.getElementById('reg-telegram').value.replace('@', '').trim();
      const phone = document.getElementById('reg-phone').value.trim();

      const newUser = {
        id: `usr_${Date.now()}`,
        name,
        email,
        avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80',
        tier: window.AppState.regTier,
        isVerified: window.AppState.regTier === 'PRO',
        telegramHandle: telegram,
        viberNumber: phone,
        phoneNumber: phone,
        township: 'Yangon',
        bio: 'New Tech Swap community member'
      };

      window.AppState.users.unshift(newUser);
      window.AppState.currentUser = newUser;
      saveUserState();

      window.closeAuthModal();
      document.getElementById('auth-signup-view').reset();
      window.renderUserNav();
      window.renderListings();
      window.showToast(`Account registered! Welcome, ${newUser.name}!`);

      // အကောင့်ဖွင့်ပြီးတာနဲ့ Listing ပစ္စည်းတင်မည့် Modal ကို ဆက်လက်ဖွင့်ပေးခြင်း
      window.openCreateListingModal();
    };

    window.openSchemaModal = function() {
      document.getElementById('prisma-code-block').textContent = PRISMA_SCHEMA_CODE;
      window.setSchemaTab('PRISMA');
      const modal = document.getElementById('schema-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      lucide.createIcons();
    };

    window.closeSchemaModal = function() {
      const modal = document.getElementById('schema-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    };

    window.setSchemaTab = function(tab) {
      const tabPrisma = document.getElementById('schema-tab-prisma');
      const tabP2p = document.getElementById('schema-tab-p2p');
      const viewPrisma = document.getElementById('schema-view-prisma');
      const viewP2p = document.getElementById('schema-view-p2p');

      if (tab === 'PRISMA') {
        tabPrisma.className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition bg-slate-200 dark:bg-slate-800 text-slate-900 dark:text-white';
        tabP2p.className = 'px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-600 transition';
        viewPrisma.classList.remove('hidden');
        viewP2p.classList.add('hidden');
      } else {
        tabP2p.className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition bg-slate-200 dark:bg-slate-800 text-slate-900 dark:text-white';
        tabPrisma.className = 'px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-600 transition';
        viewP2p.classList.remove('hidden');
        viewPrisma.classList.add('hidden');
      }
    };

    window.copyPrismaSchema = function() {
      const textArea = document.createElement("textarea");
      textArea.value = PRISMA_SCHEMA_CODE;
      document.body.appendChild(textArea);
      textArea.select();
      try {
        document.execCommand('copy');
        window.showToast('Prisma schema copied to clipboard!');
      } catch (err) {
        window.showToast('Unable to copy schema.');
      }
      document.body.removeChild(textArea);
    };

    window.addEventListener('DOMContentLoaded', () => {
      window.applyTheme();
      window.renderUserNav();
      window.renderCategoryPills();
    });
  </script>
</body>
</html>
